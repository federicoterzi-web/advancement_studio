<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101722">
<title>Advancement Studio · Schema Bible · 1.21.1</title>
<style>
:root{--bg:#0a0f15;--p:#111923;--p2:#17222e;--line:#2a394a;--txt:#edf5fb;--muted:#9cafc0;--a:#7fdcff;--ok:#7ee2a8;--bad:#ff8e9b;--warn:#ffd47d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0;color:var(--muted)}button,select,input,textarea{font:inherit}button,select,input,textarea{background:#0b121a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}button{cursor:pointer;background:#16212d}button.primary{background:#164055;border-color:#438db1}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.tabs{display:flex;gap:5px;margin:14px 0}.tabs button.active{border-color:var(--a);background:#183548}.grid{display:grid;grid-template-columns:320px 1fr;gap:12px}.panel{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.sticky{position:sticky;top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{margin:8px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px}.help{color:var(--muted);font-size:12px;line-height:1.45}.param{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}.param b{display:block;margin-bottom:5px}.cards{display:grid;gap:6px}.card{padding:9px;border:1px solid var(--line);border-radius:8px;background:#0d151e;cursor:pointer}.card.sel{border-color:var(--a);box-shadow:0 0 0 1px #7fdcff55}.badge{font-size:10px;border:1px solid var(--line);padding:2px 6px;border-radius:99px;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.tree{height:580px;overflow:auto;background:#080c11;border:1px solid var(--line);border-radius:10px;position:relative}.canvas{position:relative;width:1800px;height:1400px;background-image:linear-gradient(#18212b 1px,transparent 1px),linear-gradient(90deg,#18212b 1px,transparent 1px);background-size:32px 32px}.node{position:absolute;width:220px;padding:10px;border:2px solid #42586c;border-radius:11px;background:#121b25;cursor:pointer}.node.root{border-color:#936de4}.node.sel{border-color:var(--a)}.node .file{font:10px ui-monospace;color:#9cb1c4}.links{position:absolute;inset:0;pointer-events:none}.trigger-list{display:grid;gap:4px;max-height:440px;overflow:auto}.trigger{padding:7px;text-align:left;background:#0d151e}.trigger.sel{border-color:var(--a);background:#183244}.json{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.validation{display:grid;gap:6px}.v{padding:8px;border:1px solid var(--line);border-radius:7px}.v.ok{border-color:#2b6548}.v.bad{border-color:#743944}.v.warn{border-color:#705a28}@media(max-width:900px){.grid{grid-template-columns:1fr}.sticky{position:static}.row,.three{grid-template-columns:1fr}.tree{height:480px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><h1>🧬 Advancement Studio — Schema Bible</h1><p>Minecraft Java 1.21.1 · Fabric · generador guiado por esquema</p></div><div class="toolbar"><button class="primary" onclick="newProject()">＋ Nuevo</button><button onclick="save()">💾 Guardar</button><button onclick="validateTab()">🔍 Validar</button><button onclick="exportZip()">📦 Exportar ZIP</button></div></div>
<div class="tabs"><button id="tTree" class="active" onclick="tab('tree')">🌳 Árbol</button><button id="tEdit" onclick="tab('edit')">🛠 Editor</button><button id="tVal" onclick="tab('val')">🔍 Validador</button><button id="tSchema" onclick="tab('schema')">📜 Schema</button></div>
<div id="app"></div></div>
<script>
const VERSION="1.21.1",NSKEY="advstudio_schema_bible_1211";
const TRIGGERS=[
["bee_nest_destroyed","Bee nest destroyed","blocks",["player","block","item","num_bees_inside"]],
["bred_animals","Bred animals","entities",["parent","partner","child"]],
["brewed_potion","Brewed potion","items",["potion"]],
["changed_dimension","Changed dimension","movement",["from","to"]],
["channeled_lightning","Channeled lightning","combat",["victims"]],
["construct_beacon","Construct beacon","world",["level"]],
["consume_item","Consume item","items",["item"]],
["cured_zombie_villager","Cured zombie villager","entities",["zombie","villager"]],
["effects_changed","Effects changed","world",["effects"]],
["enchanted_item","Enchanted item","items",["item","levels_changed"]],
["enter_block","Enter block","blocks",["block"]],
["entity_hurt_player","Entity hurts player","combat",["damage"]],
["entity_killed_player","Entity kills player","combat",["entity"]],
["filled_bucket","Filled bucket","items",["item"]],
["fishing_rod_hooked","Fishing rod hooked","items",["item","entity"]],
["hero_of_the_village","Hero of the village","world",["location"]],
["impossible","Impossible","special",[]],
["inventory_changed","Inventory changed","items",["slots","items"]],
["item_durability_changed","Item durability changed","items",["durability","delta","item"]],
["item_used_on_block","Item used on block","blocks",["location","item","block"]],
["killed_by_crossbow","Killed by crossbow","combat",["victims"]],
["levitation","Levitation","movement",["distance","duration"]],
["location","Location","movement",["player"]],
["nether_travel","Nether travel","movement",["start_position","distance"]],
["placed_block","Placed block","blocks",["block","item","location"]],
["player_generates_container_loot","Player generates container loot","world",["loot_table"]],
["player_hurt_entity","Player hurts entity","combat",["entity","damage"]],
["player_interacted_with_entity","Player interacted with entity","entities",["item","entity"]],
["player_killed_entity","Player killed entity","combat",["entity"]],
["recipe_unlocked","Recipe unlocked","recipes",["recipe"]],
["shot_crossbow","Shot crossbow","combat",["item","unique_entity_types"]],
["slept_in_bed","Slept in bed","movement",["location"]],
["slide_down_block","Slide down block","movement",["block"]],
["started_riding","Started riding","movement",["vehicle"]],
["summoned_entity","Summoned entity","entities",["entity"]],
["tame_animal","Tame animal","entities",["entity"]],
["target_hit","Target hit","combat",["signal_strength"]],
["thrown_item_picked_up_by_entity","Thrown item picked up by entity","items",["item","entity"]],
["thrown_item_picked_up_by_player","Thrown item picked up by player","items",["item"]],
["tick","Tick","special",["player"]],
["used_ender_eye","Used ender eye","items",["distance"]],
["used_totem","Used totem","items",["item"]],
["using_item","Using item","items",["item"]],
["villager_trade","Villager trade","entities",["item","villager"]],
["default_block_use","Default block use","blocks",["location","item","block"]],
["any_block_use","Any block use","blocks",["location","item","block"]],
["allay_drop_item_on_block","Allay drop item on block","blocks",["location","item"]]
];
const GROUP={items:"🎒 Items",blocks:"🧱 Blocks",combat:"⚔️ Combat",movement:"🧭 Movement",entities:"🧟 Entities",world:"🌎 World",recipes:"📖 Recipes",special:"⚙️ Special"};
const ITEMTR=["inventory_changed","consume_item","enchanted_item","filled_bucket","item_used_on_block","player_interacted_with_entity","shot_crossbow","thrown_item_picked_up_by_entity","thrown_item_picked_up_by_player","used_totem","using_item"];
const state={nodes:[],sel:null,tab:"tree",ns:"ggg"};
const uid=()=>crypto.randomUUID?.()||Date.now()+"_"+Math.random().toString(36).slice(2);
function root(){return{id:uid(),name:"root",root:true,parent:null,display:{title:"Root",description:"",icon:"minecraft:grass_block",frame:"task",background:"minecraft:textures/gui/advancements/backgrounds/stone.png",show_toast:false,announce_to_chat:false,hidden:false},criteria:[],requirements:[],rewards:{},pos:{x:750,y:40},saved:false}}
function node(){return{id:uid(),name:"nuevo_avance",root:false,parent:null,display:{title:"Nuevo avance",description:"",icon:"minecraft:stone",frame:"task",background:"",show_toast:true,announce_to_chat:true,hidden:false},criteria:[],requirements:[],rewards:{},pos:{x:750,y:240},saved:false}}
function init(){if(!state.nodes.length){state.nodes=[root()];state.sel=state.nodes[0].id}render()}
function selected(){return state.nodes.find(n=>n.id===state.sel)}
function parent(n){return n?.parent?state.nodes.find(x=>x.id===n.parent):null}
function clean(v){return(v||"").trim().replaceAll("\\","/").replace(/^\/+|\/+$/g,"").replace(/[^A-Za-z0-9_./-]/g,"_")||"nuevo_avance"}
function unique(v,ignore){let b=clean(v),x=b,i=2;while(state.nodes.some(n=>n!==ignore&&n.name===x))x=b+"_copy"+i++;return x}
function newProject(){if(state.nodes.length&&!confirm("¿Crear un proyecto nuevo?"))return;state.nodes=[root()];state.sel=state.nodes[0].id;saveLocal();render()}
function addChild(){let p=selected();if(!p)return;let n=node();n.name=unique(p.name+"_child");n.parent=p.id;n.display.title="Hijo de "+p.display.title;n.pos={x:p.pos.x,y:p.pos.y+220};state.nodes.push(n);state.sel=n.id;saveLocal();render()}
function duplicate(){let n=selected();if(!n)return;let x=structuredClone(n);x.id=uid();x.name=unique(n.name+"_copy");x.root=false;x.display.title+=" (copia)";x.pos={x:n.pos.x+250,y:n.pos.y+30};state.nodes.push(x);state.sel=x.id;saveLocal();render()}
function remove(){let n=selected();if(!n)return;if(!confirm("Eliminar "+n.name+"?"))return;state.nodes=state.nodes.filter(x=>x.id!==n.id);state.nodes.forEach(x=>{if(x.parent===n.id){x.parent=null;x.root=true}});if(!state.nodes.length)state.nodes=[root()];if(!state.nodes.some(x=>x.root)){state.nodes[0].root=true;state.nodes[0].parent=null}state.sel=state.nodes[0].id;saveLocal();render()}
function setParent(v){let n=selected();if(!n)return;if(!v){n.parent=null;n.root=true}else{let p=state.nodes.find(x=>x.id===v);let cur=p;while(cur){if(cur.id===n.id)return alert("Eso crea un ciclo.");cur=parent(cur)}n.parent=p.id;n.root=false}n.saved=false;saveLocal();render()}
function saveLocal(){localStorage.setItem(NSKEY,JSON.stringify(state))}
function save(){state.nodes.forEach(n=>n.saved=true);saveLocal();render();alert("Guardado en este navegador.")}
function tab(t){state.tab=t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.getElementById(t==="tree"?"tTree":t==="edit"?"tEdit":t==="val"?"tVal":"tSchema").classList.add("active");render()}
function validateTab(){state.tab="val";render()}
function setBasic(path,v){let n=selected();let a=path.split(".");let o=n;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=v;n.saved=false;saveLocal();render()}
function addCriterion(){let n=selected();let id="criterio_"+(n.criteria.length+1);n.criteria.push({id,trigger:"inventory_changed",conditions:{}});n.requirements=[...(n.requirements.length?n.requirements:[[]])];n.requirements[0].push(id);n.saved=false;saveLocal();render()}
function delCriterion(i){let n=selected(),id=n.criteria[i].id;n.criteria.splice(i,1);n.requirements=n.requirements.map(g=>g.filter(x=>x!==id)).filter(Boolean).filter(g=>g.length);saveLocal();render()}
function changeTrigger(i,v){let c=selected().criteria[i];c.trigger=v;c.conditions={};saveLocal();render()}
function setCond(i,key,v){let c=selected().criteria[i];if(v===""){delete c.conditions[key]}else if(key==="slots"||key==="items"||key==="entity"||key==="damage"||key==="effects"||key==="player"||key==="location"||key==="block"||key==="item")try{c.conditions[key]=JSON.parse(v)}catch{c.conditions[key]=v}else c.conditions[key]=Number.isFinite(+v)&&v.trim()!==""?+v:v;selected().saved=false;saveLocal();render()}
function field(label,value,oninput,help=""){return `<div class="field"><label>${label}</label><input value="${esc(value)}" oninput="${oninput}">${help?`<div class="help">${help}</div>`:""}</div>`}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]) )}
function condUI(c,i){
 const t=c.trigger, h=`<div class="param"><b>📜 Schema 1.21.1</b><div class="help">Estos campos son los que el editor conoce para este trigger. Los campos internos no se exportan. Si necesitás una estructura que todavía no tenga formulario guiado, usá JSON avanzado: el validador la marcará como “manual” en vez de fingir que es válida.</div></div>`;
 if(t==="inventory_changed")return h+`<div class="param"><b>🎒 Items</b>${field("Lista de item predicates",JSON.stringify(c.conditions.items||[],null,2),`setCond(${i},'items',this.value)`,`Ej.: [{"items":"minecraft:diamond"}]`)}</div><div class="param"><b>Slots</b>${field("slots",JSON.stringify(c.conditions.slots||{},null,2),`setCond(${i},'slots',this.value)`,`occupied/full/empty usan rangos.`)}</div>`;
 if(ITEMTR.includes(t))return h+`<div class="param"><b>📦 Item predicate</b>${field("JSON del item",JSON.stringify(c.conditions.item||{},null,2),`setCond(${i},'item',this.value)`,`En 1.21.1 el ItemPredicate usa la forma post-components: items, count, components, predicates.`)}</div>`;
 if(t==="changed_dimension")return h+`<div class="row">${field("from",c.conditions.from||"",`setCond(${i},'from',this.value)`)}${field("to",c.conditions.to||"",`setCond(${i},'to',this.value)`)}</div>`;
 if(t==="location"||t==="slept_in_bed")return h+`<div class="param"><b>📍 Player / Location predicate</b>${field("player (JSON)",JSON.stringify(c.conditions.player||[],null,2),`setCond(${i},'player',this.value)`,`Para location el schema usa player como lista de EntityPredicates; dentro de predicate.location va LocationPredicate.`)}</div>`;
 if(["player_killed_entity","player_hurt_entity","entity_killed_player","entity_hurt_player","player_interacted_with_entity","summoned_entity","tame_animal"].includes(t))return h+field("entity (JSON)",JSON.stringify(c.conditions.entity||[],null,2),`setCond(${i},'entity',this.value)`,`Lista de EntityPredicates.`);
 if(t==="recipe_unlocked")return h+field("recipe",c.conditions.recipe||"",`setCond(${i},'recipe',this.value)`);
 if(t==="construct_beacon")return h+field("level",c.conditions.level?.min??c.conditions.level??"",`setCond(${i},'level',this.value)`,`MinMaxBounds.`);
 if(t==="target_hit")return h+field("signal_strength",c.conditions.signal_strength?.min??c.conditions.signal_strength??"",`setCond(${i},'signal_strength',this.value)`);
 if(t==="used_ender_eye")return h+field("distance",JSON.stringify(c.conditions.distance||{},null,2),`setCond(${i},'distance',this.value)`);
 if(t==="levitation")return h+`<div class="row">${field("distance (JSON)",JSON.stringify(c.conditions.distance||{},null,2),`setCond(${i},'distance',this.value)`)}${field("duration (JSON)",JSON.stringify(c.conditions.duration||{},null,2),`setCond(${i},'duration',this.value)`)}</div>`;
 if(t==="impossible"||t==="tick")return h+`<div class="param"><b>Sin conditions</b><div class="help">El esquema no necesita parámetros para este trigger.</div></div>`;
 return h+`<div class="param"><b>🧩 Modo manual</b><div class="help">Este trigger está reconocido por el esquema, pero este formulario no inventará campos. Pegá las conditions exactas según el esquema en JSON avanzado.</div></div>`;
}
function advanced(c,i){return `<details><summary>🧾 Conditions JSON avanzado</summary><textarea onchange="adv(${i},this.value)">${esc(JSON.stringify(c.conditions||{},null,2))}</textarea><div class="help">El JSON avanzado reemplaza las conditions. El validador comprobará las claves conocidas cuando exista una definición específica.</div></details>`}
function adv(i,v){try{selected().criteria[i].conditions=JSON.parse(v);selected().saved=false;saveLocal();render()}catch(e){alert("JSON inválido")}}
function criterion(c,i){return `<div class="param"><div class="top"><div><b>Criterio ${i+1}</b><div class="help">${esc(c.id)}</div></div><button onclick="delCriterion(${i})">🗑</button></div><div class="field"><label>Trigger</label><select onchange="changeTrigger(${i},this.value)">${TRIGGERS.map(t=>`<option value="${t[0]}" ${t[0]===c.trigger?"selected":""}>${GROUP[t[2]]} · ${t[1]}</option>`).join("")}</select></div>${condUI(c,i)}${advanced(c,i)}</div>`}
function edit(){let n=selected();if(!n)return"";return `<div class="grid"><div class="panel sticky"><h2>📁 Ficha</h2>${field("Nombre de archivo",n.name,`rename(this.value)`,"Se exporta como .json. Minecraft 1.21.1 usará este nombre en el parent.")}<div class="field"><label>Parent</label><select onchange="setParent(this.value)"><option value="">🌳 ROOT / sin parent</option>${state.nodes.filter(x=>x!==n).map(x=>`<option value="${x.id}" ${n.parent===x.id?"selected":""}>${esc(x.name)} — ${esc(x.display.title)}</option>`).join("")}</select></div><button class="primary" onclick="save()">💾 Guardar</button> <button onclick="addChild()">＋ Hijo</button> <button onclick="duplicate()">⧉ Duplicar</button> <button onclick="remove()">🗑</button><div class="param"><b>${n.saved?"🟢 Guardado":"🟡 Borrador"}</b><div class="help">El guardado persiste en este navegador.</div></div></div><div><div class="panel"><h2>🎨 Display</h2><div class="row">${field("Título",n.display.title,`setBasic('display.title',this.value)`)}${field("Icono",n.display.icon,`setBasic('display.icon',this.value)`,"1.21.1 usa icon.id.")}</div>${field("Descripción",n.display.description,`setBasic('display.description',this.value)`)}<div class="row"><div class="field"><label>Frame</label><select onchange="setBasic('display.frame',this.value)"><option ${n.display.frame==="task"?"selected":""}>task</option><option ${n.display.frame==="goal"?"selected":""}>goal</option><option ${n.display.frame==="challenge"?"selected":""}>challenge</option></select></div>${field("Background",n.display.background,`setBasic('display.background',this.value)`)}</div></div><div class="panel"><div class="top"><h2>🎯 Criteria</h2><button onclick="addCriterion()">＋ Criterio</button></div>${n.criteria.map(criterion).join("")}</div><div class="panel"><h2>🏆 Requirements</h2>${requirementsUI(n)}</div></div></div>`}
function rename(v){let n=selected(),x=clean(v);if(state.nodes.some(o=>o!==n&&o.name===x))return alert("Nombre duplicado");n.name=x;n.saved=false;saveLocal();render()}
function requirementsUI(n){return `<div class="help">Cada array interno es AND. Los arrays externos se combinan como OR. Ejemplo: [A,B] + [C] = (A AND B) OR C.</div>${n.requirements.map((g,i)=>`<div class="param"><b>Grupo ${i+1} (AND)</b>${g.map(id=>`<span class="badge">${esc(id)}</span>`).join(" ")} <button onclick="addReq(${i})">＋</button> <button onclick="delReq(${i})">🗑</button></div>`).join("")}<button onclick="addReqGroup()">＋ Grupo OR</button>`}
function addReq(i){let n=selected();let ids=n.criteria.map(c=>c.id).filter(x=>!n.requirements.some(g=>g.includes(x)));if(ids[0])n.requirements[i].push(ids[0]);saveLocal();render()}
function delReq(i){selected().requirements.splice(i,1);saveLocal();render()}
function addReqGroup(){selected().requirements.push([]);saveLocal();render()}
function tree(){let nodes="",links="";let roots=state.nodes.filter(n=>!n.parent);let levels={};function walk(n,l){(levels[l]??=[]).push(n);state.nodes.filter(x=>x.parent===n.id).forEach(c=>walk(c,l+1))}roots.forEach(r=>walk(r,0));Object.entries(levels).forEach(([l,a])=>a.forEach((n,i)=>n.pos={x:850+(i-(a.length-1)/2)*270,y:50+Number(l)*210}));state.nodes.forEach(n=>{if(n.parent){let p=parent(n);if(p)links+=`<line x1="${p.pos.x+110}" y1="${p.pos.y+135}" x2="${n.pos.x+110}" y2="${n.pos.y}" stroke="#60778e" stroke-width="3"/>`}nodes+=`<div class="node ${n.root?"root ":""}${n.id===state.sel?"sel":""}" style="left:${n.pos.x}px;top:${n.pos.y}px" onclick="sel('${n.id}')"><b>🌳 ${esc(n.display.title)}</b><div class="file">${esc(n.name)}.json</div><div class="help">${n.parent?"↳ "+esc(parent(n)?.name||""):"ROOT"}</div></div>`});return `<div class="panel"><div class="top"><div><h2>🌳 Árbol</h2><div class="help">El parent exportado siempre usa namespace:nombre_del_archivo, nunca el UUID interno.</div></div><div><button onclick="addChild()">＋ Hijo</button> <button onclick="tab('edit')">🛠 Ficha</button></div></div><div class="tree"><div class="canvas"><svg class="links" width="1800" height="1400">${links}</svg>${nodes}</div></div></div>`}
function sel(id){state.sel=id;render()}
function schemaTab(){return `<div class="panel"><h2>📜 La Biblia del generador</h2><p>Esta versión no toma como autoridad una lista inventada de campos. La referencia conceptual es <b>SpyglassMC/vanilla-mcdoc</b>, las definiciones de Minecraft que describen CODECs, JSON y NBT. El repositorio es MIT y sigue actualizado. </p><div class="param"><b>Fuente primaria del esquema</b><div class="help">vanilla-mcdoc / java/data/advancement/predicate.mcdoc. Ahí están ItemPredicate, BlockPredicate, LocationPredicate, EntityPredicate, MinMaxBounds y las reglas por versión. Por ejemplo: ItemPredicate post-1.20.5 usa items, count, components y predicates; LocationPredicate 1.21.1 usa position, biomes, structures, dimension, light, block, fluid, smokey y can_see_sky.</div></div><div class="param"><b>Regla de oro</b><div class="help">Si un campo no está respaldado por la definición 1.21.1, el editor no lo inventa. El modo manual permite pegar JSON, pero el validador lo marcará como manual cuando no tenga una regla específica incorporada.</div></div><div class="param"><b>Nota sobre SPGoding</b><div class="help">El repositorio SPGoding/datapack-json-schemas que encontramos está archivado y apunta a versiones antiguas; por eso no lo uso como fuente de verdad para 1.21.1.</div></div></div>`}
function validate(){let out=[],names=new Set();if(!state.nodes.length)out.push(["bad","No hay advancements"]);state.nodes.forEach(n=>{if(names.has(n.name))out.push(["bad",`${n.name}: nombre duplicado`]);names.add(n.name);if(!/^[a-z0-9_./-]+$/.test(n.name))out.push(["bad",`${n.name}: el nombre debe ser lowercase/namespace-safe`]);if(n.parent&&!parent(n))out.push(["bad",`${n.name}: parent inexistente`]);if(!n.criteria.length)out.push(["warn",`${n.name}: no tiene criteria`]);let ids=new Set();n.criteria.forEach(c=>{if(ids.has(c.id))out.push(["bad",`${n.name}: criterion duplicado ${c.id}`]);ids.add(c.id);let td=TRIGGERS.find(t=>t[0]===c.trigger);if(!td)out.push(["bad",`${n.name}: trigger no definido`]);if(td&&Object.keys(c.conditions||{}).some(k=>!td[3].includes(k)))out.push(["bad",`${n.name}/${c.id}: '${Object.keys(c.conditions).find(k=>!td[3].includes(k))}' no está permitido por la definición guiada de este trigger`]);});let flat=n.requirements.flat();n.criteria.forEach(c=>{if(n.requirements.length&&!flat.includes(c.id))out.push(["warn",`${n.name}: ${c.id} no aparece en requirements`] )})});state.nodes.forEach(n=>{let seen=new Set(),c=n;while(c?.parent){if(seen.has(c.id)){out.push(["bad",`${n.name}: ciclo de parents`]);break}seen.add(c.id);c=parent(c)}});if(!out.length)out.push(["ok","La estructura básica y las reglas guiadas conocidas están correctas."]);return out}
function val(){let v=validate();return `<div class="panel"><h2>🔍 Validador</h2><div class="help">No promete “Minecraft lo acepta” si el formulario no tiene la definición específica. Las zonas manuales quedan identificadas como tales. La fuente de tipos es la definición vanilla-mcdoc.</div><div class="validation">${v.map(x=>`<div class="v ${x[0]}">${x[0]==="ok"?"✅":x[0]==="bad"?"❌":"⚠️"} ${esc(x[1])}</div>`).join("")}</div><div class="param"><b>JSON exportable del seleccionado</b><pre class="json">${esc(selected()?JSON.stringify(exportJSON(selected()),null,2):"")}</pre></div></div>`}
function exportJSON(n){let o={};if(n.parent){let p=parent(n);if(p)o.parent=state.ns+":"+p.name}o.display={icon:{id:n.display.icon||"minecraft:stone"},title:{text:n.display.title||""},description:{text:n.display.description||""},frame:n.display.frame||"task",show_toast:n.display.show_toast!==false,announce_to_chat:n.display.announce_to_chat!==false,hidden:n.display.hidden===true};if(n.root&&n.display.background)o.display.background=n.display.background;o.criteria={};n.criteria.forEach(c=>{o.criteria[c.id]={trigger:"minecraft:"+c.trigger};if(Object.keys(c.conditions||{}).length)o.criteria[c.id].conditions=c.conditions});if(n.requirements.length)o.requirements=n.requirements.map(g=>g.filter(Boolean)).filter(g=>g.length);if(Object.keys(n.rewards||{}).length)o.rewards=n.rewards;return o}
function render(){let app=document.getElementById("app");app.innerHTML=state.tab==="tree"?tree():state.tab==="edit"?edit():state.tab==="val"?val():schemaTab()}
function saveLocal(){localStorage.setItem(NSKEY,JSON.stringify(state))}
function load(){try{let x=JSON.parse(localStorage.getItem(NSKEY));if(x){Object.assign(state,x);render()}}catch{}}
function save(){state.nodes.forEach(n=>n.saved=true);saveLocal();render();alert("Guardado.")}
async function exportZip(){let errors=validate().filter(x=>x[0]==="bad");if(errors.length&&!confirm("Hay errores. ¿Exportar de todos modos?"))return;let files={};files["pack.mcmeta"]=JSON.stringify({pack:{pack_format:48,description:`Advancement Studio — ${state.ns} — Minecraft Java 1.21.1`}},null,2);state.nodes.forEach(n=>files[`data/${state.ns}/advancement/${n.name}.json`]=JSON.stringify(exportJSON(n),null,2));files["README.txt"]=`Minecraft Java 1.21.1 / Fabric\\nSchema source: SpyglassMC vanilla-mcdoc\\nAdvancement path: data/${state.ns}/advancement/\\n`;let blob=zip(files);let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`advancements_${state.ns}.zip`;a.click()}
function crc(b){let c=-1;for(let x of b){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^=-1)>>>0}function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}function cat(...a){let n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n),p=0;for(let x of a)o.set(x,p),p+=x.length;return o}function zip(fs){let e=new TextEncoder(),parts=[],cent=[],off=0;for(let name in fs){let n=e.encode(name),d=e.encode(fs[name]),c=crc(d),h=cat(new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d);parts.push(h);cent.push(cat(new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),n));off+=h.length}let c=cat(...cent);return new Blob([cat(...parts,c,new Uint8Array([80,75,5,6,0,0,0,0]),u16(Object.keys(fs).length),u16(Object.keys(fs).length),u32(c.length),u32(off),u16(0))],{type:"application/zip"})}
init();load();
</script></body></html>
